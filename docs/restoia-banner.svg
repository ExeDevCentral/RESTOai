<svg viewBox="0 0 900 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#14110e"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="900" height="240" rx="18" fill="url(#bgGrad)" stroke="#e0a96d" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- FUEGOS ARTIFICIALES IZQUIERDA -->
  <g transform="translate(140, 95)">
    <circle cx="0" cy="0" r="4" fill="#fbbf24" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <line x1="0" y1="0" x2="-45" y2="-40" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,50; 50,0; 0,50" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="45" y2="-45" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,50; 50,0; 0,50" dur="2.1s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="-55" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,50; 50,0; 0,50" dur="2.7s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="50" y2="30" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,50; 50,0; 0,50" dur="2.3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,60; 60,0; 0,60" dur="1.9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- FUEGOS ARTIFICIALES DERECHA -->
  <g transform="translate(760, 90)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <line x1="0" y1="0" x2="-40" y2="-45" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,50; 50,0; 0,50" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="45" y2="-35" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,50; 50,0; 0,50" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="-50" y2="25" stroke="#34d399" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,50; 50,0; 0,50" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="40" y2="40" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,50; 50,0; 0,50" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="0" y2="-55" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0,55; 55,0; 0,55" dur="1.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- DESTELLOS DE LUZ -->
  <g fill="#fff" filter="url(#sparkleGlow)">
    <circle cx="80" cy="40" r="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="30" r="2.5">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="35" r="2.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="180" r="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="190" r="2">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="1.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- TÍTULO PRINCIPAL -->
  <text x="450" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="2">
    RESTO<tspan fill="url(#goldGrad)" filter="url(#sparkleGlow)">ia</tspan>
  </text>

  <!-- SUBTÍTULO -->
  <text x="450" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="15" fill="#e0a96d" letter-spacing="3">
    SUITE GASTRONÓMICA INTELIGENTE • MOTOR KOBE
  </text>

  <!-- BADGES Y DESTACADOS -->
  <text x="450" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e1">
    Cero Fricción • Auditoría Inmutable SHA-256 • Dinero en Centavos Exactos • 100% Offline
  </text>

  <rect x="230" y="178" width="440" height="30" rx="15" fill="#1e1b18" stroke="#f59e0b" stroke-width="1"/>
  <text x="450" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="12" fill="#fbbf24">
    EL CONTROL TOTAL DE TU SALÓN, COCINA Y CAJA EN UN SOLO LUGAR
  </text>
</svg>
